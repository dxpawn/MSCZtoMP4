[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mscz2mp4"
version = "0.1.0"
description = "Turn a MuseScore score (.mscz) into a falling-notes piano video with the score scrolling on top"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "src/mscz2mp4/fonts/OFL.txt"]
requires-python = ">=3.10"
dependencies = [
    "imageio-ffmpeg>=0.5",
    "mido>=1.3",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10",
]
keywords = ["musescore", "piano", "midi", "video", "visualizer", "synthesia"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/dxpawn/MSCZtoMP4"
Issues = "https://github.com/dxpawn/MSCZtoMP4/issues"

[project.scripts]
mscz2mp4 = "mscz2mp4.cli:main"

[tool.setuptools.package-data]
mscz2mp4 = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
